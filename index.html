<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f7" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Press Logger" />
  <title>Button Press Logger</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div class="stage">
      <header>
        <h1>Button Press Logger</h1>
      </header>

      <section class="panel session">
        <label for="session-id">Session ID</label>
        <input id="session-id" type="text" placeholder="e.g. P01 (auto if blank)" autocomplete="off" autocapitalize="characters" />
        <span id="session-status" class="status">No active session</span>
      </section>

      <section class="panel timer">
        <div id="timer-display" class="timer-display" aria-live="off">00:00.000</div>
        <div class="timer-controls">
          <button id="btn-start" class="ctrl primary">Start</button>
          <button id="btn-pause" class="ctrl" disabled>Pause</button>
          <button id="btn-stop" class="ctrl danger" disabled>Stop</button>
        </div>
        <div id="last-press" class="last-press" aria-live="polite">&nbsp;</div>
      </section>

      <section class="pad" id="pad" aria-label="Response buttons">
        <!-- populated by app.js -->
      </section>
      <p class="hint">Keyboard: press <kbd>1</kbd>–<kbd>4</kbd>. Presses only count while the timer is running.</p>
      <p class="scroll-hint">Scroll down for log &amp; export ↓</p>
    </div>

    <section class="panel log">
      <div class="log-header">
        <h2>Log</h2>
        <div class="log-actions">
          <button id="btn-undo" class="ctrl small">Undo last</button>
          <button id="btn-clear" class="ctrl small danger">Clear log</button>
        </div>
      </div>

      <div class="export">
        <label for="export-scope">Export</label>
        <select id="export-scope"></select>
        <button id="btn-csv" class="ctrl small primary">Download CSV</button>
        <button id="btn-json" class="ctrl small">Download JSON</button>
      </div>

      <div id="counts" class="counts"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Session</th>
              <th>Button</th>
              <th>Elapsed</th>
              <th>Timestamp</th>
            </tr>
          </thead>
          <tbody id="log-body"></tbody>
        </table>
        <p id="log-empty" class="empty">No presses recorded yet.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
